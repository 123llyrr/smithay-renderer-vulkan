[package]
name = "smithay-renderer-vulkan"
version = "0.1.2"
authors = ["123llyrr", "Clarion Contributors", "Smithay Contributors"]
edition = "2021"
rust-version = "1.80"
description = "High-performance native Vulkan 1.3 rendering backend and Smithay Renderer adapter with full HDR10 / scRGB color management, 3D LUT sampling, and zero-copy DMA-BUF"
license = "MIT OR Apache-2.0"
repository = "https://github.com/123llyrr/smithay-renderer-vulkan"
readme = "README.md"
keywords = ["wayland", "smithay", "vulkan", "hdr", "compositor"]
categories = ["graphics", "rendering", "gui"]

[dependencies]
anyhow = "1.0"
ash = { version = "0.38.0", default-features = false, features = ["std", "libloading"] }
bitflags = "2.13.1"
bytemuck = { version = "1.25.2", features = ["derive"] }
calloop = { version = "0.14.4", features = ["executor", "futures-io", "signals"] }
drm-ffi = "0.9.1"
glam = "0.33"
libc = "0.2.189"
smallvec = "1.15.2"
tracing = "0.1.44"

# In-process shader compilation backends (replaces external glslc/vulkan-shader-compiler CLI)
naga = { version = "25.0.1", optional = true, default-features = false, features = ["glsl-in", "spv-out"] }
shaderc = { version = "0.10.1", optional = true }

smithay = { version = "0.7.0", default-features = false, features = [
    "backend_drm",
    "backend_egl",
    "backend_gbm",
    "backend_vulkan",
    "backend_winit",
    "desktop",
    "renderer_gl",
    "wayland_frontend",
] }

[features]
default = []
naga = ["dep:naga"]
shaderc = ["dep:shaderc"]
clarion_internal_tests = []

[dev-dependencies]
tracing-subscriber = "0.3"
